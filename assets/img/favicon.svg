             C 380 226 540 222 660 230
             C 686 234 700 246 702 270
             L 702 310
             C 700 348 678 366 638 372
             C 530 384 392 388 318 396
             C 284 400 266 418 266 444
             C 266 470 286 486 320 490
             C 440 502 580 496 652 508
             C 718 520 746 568 738 626
             C 726 706 600 778 460 808
             C 390 822 310 828 246 828" stroke-width="60"/>
  </g>
</svg>
