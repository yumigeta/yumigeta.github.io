<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- white paper background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#ffffff"/>
  <g fill="none" stroke="#bf2f25" stroke-linecap="round" stroke-linejoin="round">
    <!-- square frame -->
    <rect x="104" y="104" width="816" height="816" rx="44" stroke-width="42"/>
    <!-- upward flick at top-right, joined to the corner -->
